name: Ubuntu RDP y Moonlight

on:
  workflow_dispatch:
    inputs:
      rdp_password:
        description: 'Contraseña para el usuario RDP'
        required: true
        type: string

jobs:
  rdp-ubuntu:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Liberar Espacio en Disco
        run: |
          echo "Liberando espacio..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Instalar Entorno Gráfico (XFCE4), xRDP y Servidor de Pantalla Virtual
        run: |
          sudo apt-get update
          # Instalamos XFCE4 (escritorio ligero) y xRDP
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 xvfb xserver-xorg-video-dummy
          
          # Configurar xRDP para usar XFCE4
          echo xfce4-session > ~/.xsession
          sudo cp ~/.xsession /etc/skel/
          
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          sudo adduser xrdp ssl-cert

      - name: Instalar Herramientas (FFmpeg, MKVToolNix, 7-Zip, Git)
        run: |
          sudo apt-get install -y ffmpeg mkvtoolnix mkvtoolnix-gui p7zip-full p7zip-rar git curl wget

      - name: Instalar Navegador Brave
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" | sudo tee /etc/apt/sources.list.d/brave-browser-release.list
          sudo apt-get update
          sudo apt-get install -y brave-browser

      - name: Configurar Usuario RDP
        run: |
          sudo useradd -m -s /bin/bash RDP
          echo "RDP:${{ github.event.inputs.rdp_password }}" | sudo chpasswd
          sudo usermod -aG sudo RDP
          
          # Asignar entorno gráfico al usuario
          sudo bash -c 'echo "xfce4-session" > /home/RDP/.xsession'
          
          # Crear carpetas CON SUDO
          sudo mkdir -p /home/RDP/Downloads
          sudo mkdir -p /home/RDP/Desktop
          
          # Hacer al usuario RDP dueño de su propio directorio
          sudo chown -R RDP:RDP /home/RDP

      - name: Instalar Python y Descargar Scripts
        run: |
          sudo apt-get install -y python3-pip python3-venv
          
          # Instalar dependencias de Python (SIN el flag --break-system-packages)
          sudo pip3 install transformers datasets huggingface_hub accelerate tokenizers diffusers requests PyGithub httpx aiohttp tqdm pillow numpy pandas

          # Descargar los archivos usando sudo y guardarlos en /home/RDP/Downloads/
          sudo wget -q -O /home/RDP/Downloads/hls.py "https://huggingface.co/CineMax/plis2/resolve/main/hls.py?download=true"
          sudo wget -q -O /home/RDP/Downloads/hug.py "https://huggingface.co/CineMax/plis2/resolve/main/hug.py?download=true"
          sudo wget -q -O /home/RDP/Downloads/huf.py "https://huggingface.co/CineMax/plis2/resolve/main/huf.py?download=true"
          sudo wget -q -O /home/RDP/Downloads/hugv3.py "https://huggingface.co/CineMax/plis2/resolve/main/hugv3.py?download=true"
          sudo wget -q -O /home/RDP/Downloads/pages.bat "https://huggingface.co/CineMax/plis2/resolve/main/pages.bat?download=true"
          sudo wget -q -O /home/RDP/Downloads/render.py "https://huggingface.co/CineMax/plis2/resolve/main/render.py?download=true"
          
          # Devolverle la propiedad de los archivos descargados al usuario RDP
          sudo chown -R RDP:RDP /home/RDP/Downloads

      - name: Instalar Wine (Para correr gMKVExtractGUI y HLS Studio .exe)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32

          # Descargar y extraer los programas de Windows con sudo
          sudo wget -q -O /home/RDP/Downloads/gMKVExtractGUI.7z "https://huggingface.co/CineMax/plis2/resolve/main/gMKVExtractGUI.v2.13.0.7z?download=true"
          sudo 7z x /home/RDP/Downloads/gMKVExtractGUI.7z -o/home/RDP/Downloads/gMKVExtractGUI -y
          
          sudo wget -q -O /home/RDP/Downloads/hls-studio-setup.exe "https://huggingface.co/CineMax/plis2/resolve/main/hls-studio%20Setup%201.0.0%20(1).exe?download=true"

          # Asegurar de nuevo que el usuario RDP sea el dueño de todo lo extraído
          sudo chown -R RDP:RDP /home/RDP/Downloads

      - name: Instalar Sunshine (Moonlight Server)
        run: |
          # Descargar paquete oficial de Sunshine para Ubuntu 22.04
          wget -q -O sunshine.deb https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-ubuntu-22.04-amd64.deb
          # Instalar (ignorando errores de dependencias primero y luego forzando)
          sudo dpkg -i sunshine.deb || sudo apt-get install -f -y
          
          # Permitir que Sunshine capture la pantalla X11
          sudo setcap cap_sys_admin+p $(readlink -f $(which sunshine))

      - name: Instalar y Conectar Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --accept-routes --shields-up=false

      - name: Obtener IP y Resumen
        run: |
          TAILSCALE_IP=$(tailscale ip -4)
          echo "=========================================================================="
          echo " ✅ SERVIDOR LINUX ESTABLECIDO"
          echo " IP Tailscale : $TAILSCALE_IP"
          echo " "
          echo " 🖥️ PARA CONECTARTE AL ESCRITORIO (RDP):"
          echo " Usa Escritorio Remoto de Windows y conéctate a: $TAILSCALE_IP"
          echo " Usuario: RDP"
          echo " Contraseña: la que introdujiste al iniciar el workflow"
          echo " "
          echo " ⚠️ NOTAS SOBRE PROGRAMAS DE WINDOWS:"
          echo " Encontrarás tus scripts y archivos en la carpeta Downloads."
          echo " Para abrir gMKVExtractGUI o HLS Studio (.exe), hazlo a través de Wine."
          echo "=========================================================================="

      - name: Keep Alive y Monitor
        run: |
          end=$((SECONDS+20400)) # 340 minutos
          while [ $SECONDS -lt $end ]; do
            disk=$(df / -h | awk 'NR==2 {print $4}')
            ram=$(free -m | awk 'NR==2 {print $4}')
            echo "[$(date +'%H:%M:%S')] Espacio libre: $disk | RAM libre: ${ram}MB"
            sleep 60
          done
